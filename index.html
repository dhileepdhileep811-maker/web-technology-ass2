<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Student Admission Registration</h1>
    <!-- novalidate: we show our own styled messages via validate.js -->
    <form id="regForm" action="../php/add.php" method="post" enctype="multipart/form-data" novalidate>
      <div class="field">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" placeholder="e.g. Karthick">
        <span class="error"></span>
      </div>
      <div class="field">
        <label for="roll_no">Roll Number *</label>
        <input type="text" id="roll_no" name="roll_no" placeholder="e.g. 25CSL06">
        <span class="error"></span>
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="you@kpriet.ac.in">
        <span class="error"></span>
      </div>
      <div class="field">
        <label for="course">Course *</label>
        <select id="course" name="course">
          <option value="">-- Select --</option>
          <option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>MECH</option>
        </select>
        <span class="error"></span>
      </div>
      <div class="field">
        <label for="password">Password *</label>
        <input type="password" id="password" name="password">
        <meter id="strength" min="0" max="4" value="0"></meter>
        <span class="error"></span>
      </div>
      <div class="field">
        <label for="profile">Profile Image (JPG/PNG, max 2 MB) *</label>
        <input type="file" id="profile" name="profile" accept="image/jpeg,image/png">
        <span class="error"></span>
      </div>
      <button type="submit">Register</button>
    </form>
  </main>
  <script src="validate.js"></script>
</body>
</html>
